name: scanpy
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - numba=0.60.0
  - scanpy=1.10.4
  - matplotlib<3.7
  - seaborn
  - pip
  - genomepy
  - anytree
  - openpyxl
  - upsetplot
  - scikit-bio
  - pip:
    - muon
    - mofax
    - mofapy2
    - decoupler==1.9.0
    - liana==1.5.0
    - omnipath
    - pydeseq2==0.5.0
    - PyComplexHeatmap
    - adjustText
  - numpy